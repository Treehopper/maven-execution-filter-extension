name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test
        run: mvn --batch-mode -Dlicense.skipDownloadLicenses=true verify
      - name: Upload coverage to Codacy
        # Requires the CODACY_PROJECT_TOKEN repository secret (Codacy dashboard -> repository
        # Settings -> Integrations -> Project API). continue-on-error so a missing/not-yet-added
        # secret doesn't fail the whole build - it just skips this step.
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: target/site/jacoco/jacoco.xml
